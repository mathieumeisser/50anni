<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathieu · 50 · Via Alta Valle Maggia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f8f6f2; --dark: #1c1810; --mid: #5e5040; --light: #9c8870;
      --accent: #b07a32; --accent-light: #dfc490; --border: #e6dfd2; --gap: 96px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; font-weight: 300; background: var(--cream); color: var(--dark); line-height: 1.7; font-size: 16px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 18px 48px; background: rgba(250,249,247,0.93); backdrop-filter: blur(8px); border-bottom: 1px solid transparent; transition: border-color 0.3s; }
    nav.scrolled { border-bottom-color: var(--border); }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dark); text-decoration: none; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--dark); }
    .lang-switcher { display: flex; gap: 6px; align-items: center; }
    .lang-btn { background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light); padding: 2px 4px; transition: color 0.2s; }
    .lang-btn.active { color: var(--dark); border-bottom: 1px solid var(--dark); }
    .lang-sep { color: var(--border); }

    /* HERO */
    #hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 24px 80px; position: relative; background: var(--dark); }
    #hero-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    /* Crossfade slideshow */
    .hero-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      animation: heroFade 40s infinite;
    }
    .hero-slide:nth-child(1) { animation-delay:  0s; }
    .hero-slide:nth-child(2) { animation-delay:  8s; }
    .hero-slide:nth-child(3) { animation-delay: 16s; }
    .hero-slide:nth-child(4) { animation-delay: 24s; }
    .hero-slide:nth-child(5) { animation-delay: 32s; }
    @keyframes heroFade {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      20%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }
    /* Gradient overlay: dark at top/bottom, slightly lighter in centre so text pops */
    #hero-bg::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, rgba(28,24,16,0.55) 0%, rgba(28,24,16,0.35) 40%, rgba(28,24,16,0.45) 70%, rgba(28,24,16,0.65) 100%); }
    #hero > *:not(#hero-bg) { position: relative; z-index: 1; }
    /* Light-colour text on dark photo */
    .hero-eyebrow { color: var(--accent-light) !important; }
    .hero-name { color: #fff !important; }
    .hero-name em { color: var(--accent-light) !important; }
    .hero-tagline { color: rgba(255,255,255,0.72) !important; }
    .cd-num { color: #fff !important; }
    .divider { background: rgba(223,196,144,0.55); }
    .scroll-hint { color: rgba(255,255,255,0.4); }
    .scroll-hint::after { background: rgba(223,196,144,0.55); }
    .hero-eyebrow { font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; }
    .hero-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(3.8rem, 11vw, 8.5rem); font-weight: 300; line-height: 0.95; letter-spacing: -0.02em; }
    .hero-name em { font-style: italic; color: var(--accent); }
    .hero-tagline { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.1rem, 2.5vw, 1.6rem); font-weight: 300; color: var(--mid); letter-spacing: 0.06em; margin: 20px 0 56px; }
    .divider { width: 36px; height: 1px; background: var(--accent-light); margin: 0 auto 52px; }
    .countdown { display: flex; gap: 44px; justify-content: center; flex-wrap: wrap; }
    .countdown-unit { text-align: center; }
    .cd-num { display: block; font-family: 'Cormorant Garamond', serif; font-size: clamp(2.8rem, 7vw, 4.5rem); font-weight: 300; line-height: 1; }
    .cd-lbl { display: block; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--light); margin-top: 6px; }
    .scroll-hint { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--light); font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .scroll-hint::after { content: ''; display: block; width: 1px; height: 28px; background: var(--accent-light); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    /* SHARED */
    .section-wrap { max-width: 920px; margin: 0 auto; padding: var(--gap) 24px; }
    .section-label { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; display: block; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 300; line-height: 1.15; margin-bottom: 28px; }
    .section-title em { font-style: italic; }
    .body-text { color: var(--mid); max-width: 640px; line-height: 1.85; }
    hr.sep { border: none; border-top: 1px solid var(--border); max-width: 920px; margin: 0 auto; }

    /* OPTIONS */
    .options-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 48px; }
    .option-card { border: 1px solid var(--border); padding: 32px 26px; display: flex; flex-direction: column; gap: 14px; transition: border-color 0.2s, box-shadow 0.2s; }
    .option-card:hover { border-color: var(--accent-light); box-shadow: 0 4px 24px rgba(0,0,0,0.05); }
    .opt-badge { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: white; background: var(--accent); display: inline-block; padding: 3px 10px; width: fit-content; }
    .opt-title { font-family: 'Cormorant Garamond', serif; font-size: 1.45rem; font-weight: 400; line-height: 1.2; }
    .opt-dates { font-size: 0.78rem; color: var(--accent); letter-spacing: 0.04em; }
    .opt-desc { font-size: 0.86rem; color: var(--mid); line-height: 1.75; flex-grow: 1; }
    .opt-includes-label { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light); display: block; margin-bottom: 8px; }
    .opt-include-item { font-size: 0.8rem; color: var(--mid); display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .opt-include-item::before { content: '—'; color: var(--accent-light); flex-shrink: 0; }

    /* PROGRAMME */
    .programme { margin-top: 48px; }
    .prog-day { border-top: 1px solid var(--border); }
    .prog-day:last-child { border-bottom: 1px solid var(--border); }
    .prog-day-header { display: grid; grid-template-columns: 110px 1fr 24px; align-items: start; gap: 16px; padding: 24px 0; cursor: pointer; }
    .prog-day-num { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); padding-top: 3px; }
    .prog-day-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 400; color: var(--dark); line-height: 1.25; }
    .prog-day-date { font-size: 0.75rem; color: var(--light); margin-top: 4px; }
    .birthday-tag { display: inline-block; margin-left: 8px; background: #f2e4c4; color: var(--accent); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; font-family: 'Inter', sans-serif; vertical-align: middle; }
    .prog-expand { font-size: 1.2rem; color: var(--light); transition: transform 0.3s; padding-top: 2px; user-select: none; }
    .prog-expand.open { transform: rotate(45deg); }
    .prog-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
    .prog-body.open { max-height: 400px; }
    .prog-inner { padding: 0 0 24px 126px; display: flex; flex-direction: column; gap: 12px; }
    .prog-desc { font-size: 0.9rem; color: var(--mid); line-height: 1.8; }
    .prog-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .prog-tag { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light); border: 1px solid var(--border); padding: 3px 9px; }
    a.prog-tag { text-decoration: none; color: var(--accent); border-color: var(--accent); opacity: 0.8; }
    a.prog-tag:hover { opacity: 1; }

    /* MAP */
    #map { height: 480px; margin-top: 32px; border: 1px solid var(--border); }
    .map-legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--mid); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ACCOMMODATION */
    .accom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 20px; margin-top: 48px; }
    .accom-card { border: 1px solid var(--border); padding: 28px 24px; }
    .accom-tag { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light); display: block; margin-bottom: 12px; }
    .accom-name { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 400; margin-bottom: 4px; }
    .accom-loc { font-size: 0.78rem; color: var(--accent); margin-bottom: 12px; }
    .accom-desc { font-size: 0.84rem; color: var(--mid); line-height: 1.75; }
    .accom-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; font-size: 0.74rem; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-light); padding-bottom: 1px; transition: all 0.2s; }
    .accom-link:hover { color: var(--dark); border-color: var(--dark); }

    /* BUTTONS */
    .btn { display: inline-block; padding: 13px 36px; background: var(--dark); color: var(--cream); font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; border: none; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent); }

    /* RECAP */
    .recap { margin-top: 48px; }
    .recap-day { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 26px 0; border-top: 1px solid var(--border); }
    .recap-day:last-child { border-bottom: 1px solid var(--border); }
    .recap-date { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); padding-top: 4px; }
    .recap-title { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 400; line-height: 1.25; margin-bottom: 8px; }
    .recap-text { font-size: 0.92rem; color: var(--mid); line-height: 1.85; }
    .thanks-sign { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.4rem; color: var(--accent); margin-top: 24px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
    .btn-ghost { background: none; color: var(--dark); border: 1px solid var(--dark); }
    .btn-ghost:hover { background: var(--dark); color: var(--cream); }
    a.btn { text-decoration: none; }

    /* FOOTER */
    footer { text-align: center; padding: 56px 24px; border-top: 1px solid var(--border); }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; margin-bottom: 10px; }
    .footer-info { font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light); }

    /* RESPONSIVE */
    @media (max-width: 800px) {
      nav { padding: 14px 20px; }
      .nav-links { display: none; }
      .options-grid { grid-template-columns: 1fr; }
      #map { height: 340px; }
      .countdown { gap: 24px; }
      .prog-inner { padding-left: 0; }
      .recap-day { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>

        location:'Cimalmotto, Campo Vallemaggia',
        desc:'Il paese offre appartamenti vacanze e alloggi locali per la notte del sabato. Disponibilità limitata — prenotate presto.',
        link:'https://www.viaaltavallemaggia.ch/en/stages/13-cimalmotto-capanna-ribia' },
      { tag:'Il Finale · Tutte le opzioni', name:'Hotel Ristorante Walser',
        location:'Bosco Gurin, Ticino',
        desc:"Il luogo della nostra celebrazione ha anche 12 confortevoli camere — ideale per arrivare sabato sera o fermarsi dopo la festa. Prenotazione diretta con l'hotel.",
        link:'https://www.hotel-boscogurin.ch/' },
      { tag:'Nei dintorni · Tutte le opzioni', name:'Boutique Hotel Locanda Fior di Campo',
        location:'Campo, Valle Maggia',
        desc:"Un incantevole hotel di charme nell'alta Valle Maggia, ben posizionato per chi viene in auto alla celebrazione finale.",
        link:'https://www.fiordicampo.ch/en/' }
    ],
  }
};

// ── STATE ─────────────────────────────────────────────────────────────
let lang = 'en';

// ── SET LANGUAGE ──────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  const t = T[l];
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    if (t[k] !== undefined) el.textContent = t[k];
  });
  document.getElementById('hero-title').innerHTML = t.hero_title;
  renderOptions(t);
  renderProgramme(t);
  renderAccom(t);
  renderRecap(t);
  document.querySelectorAll('a[href^="messageboard.html"]').forEach(a => a.href = `messageboard.html?lang=${l}`);
  document.querySelectorAll('a[href^="photos.html"]').forEach(a => a.href = `photos.html?lang=${l}`);
}

// ── RENDER OPTIONS ────────────────────────────────────────────────────
function renderOptions(t) {
  document.getElementById('options-grid').innerHTML = t.options.map((o, i) => `
    <div class="option-card">
      <span class="opt-badge">${o.badge}</span>
      <div class="opt-title">${o.title}</div>
      <div class="opt-dates">${o.dates}</div>
      <div class="opt-desc">${o.desc}</div>
      <div class="opt-includes">
        <span class="opt-includes-label">${l('includes')}</span>
        ${o.includes.map(x => `<div class="opt-include-item">${x}</div>`).join('')}
      </div>
    </div>`).join('');
}

function l(key) {
  const labels = { includes: { en:'Program', fr:'Programme', it:'Programma' } };
  return labels[key]?.[lang] || key;
}

// ── RENDER PROGRAMME ──────────────────────────────────────────────────
function renderProgramme(t) {
  document.getElementById('programme-list').innerHTML = t.days.map((d, i) => `
    <div class="prog-day">
      <div class="prog-day-header" onclick="toggleDay(${i})">
        <span class="prog-day-num">${d.num}</span>
        <div>
          <div class="prog-day-title">${d.title}${d.birthday ? '<span class="birthday-tag">🎂 Birthday</span>' : ''}</div>
          <div class="prog-day-date">${d.date}</div>
        </div>
        <span class="prog-expand" id="icon-${i}">+</span>
      </div>
      <div class="prog-body" id="body-${i}">
        <div class="prog-inner">
          <div class="prog-desc">${d.desc}</div>
          <div class="prog-tags">${d.tags.map(tag => typeof tag === 'string' ? `<span class="prog-tag">${tag}</span>` : `<a class="prog-tag" href="${tag.url}" target="_blank" rel="noopener">${tag.text}</a>`).join('')}</div>
        </div>
      </div>
    </div>`).join('');
}

function toggleDay(i) {
  document.getElementById(`body-${i}`).classList.toggle('open');
  document.getElementById(`icon-${i}`).classList.toggle('open');
}

// ── RENDER ACCOMMODATION ──────────────────────────────────────────────
function renderAccom(t) {
  const view = { en:'View', fr:'Voir', it:'Scopri' }[lang];
  document.getElementById('accom-grid').innerHTML = t.accommodation.map(a => `
    <div class="accom-card">
      <span class="accom-tag">${a.tag}</span>
      <div class="accom-name">${a.name}</div>
      <div class="accom-loc">📍 ${a.location}</div>
      <div class="accom-desc">${a.desc}</div>
      ${a.link ? `<a class="accom-link" href="${a.link}" target="_blank" rel="noopener">${view} →</a>` : ''}
    </div>`).join('');
}

// ── RENDER RECAP ──────────────────────────────────────────────────────
function renderRecap(t) {
  document.getElementById('recap-list').innerHTML = t.recap.map(d => `
    <div class="recap-day">
      <span class="recap-date">${d.date}</span>
      <div>
        <div class="recap-title">${d.title}</div>
        <div class="recap-text">${d.text}</div>
      </div>
    </div>`).join('');
}

// ── NAV SCROLL ────────────────────────────────────────────────────────
window.addEventListener('scroll', () =>
  document.getElementById('main-nav').classList.toggle('scrolled', scrollY > 40));

// ── MAP ───────────────────────────────────────────────────────────────
function initMap() {
  const map = L.map('map', { scrollWheelZoom: false }).setView([46.276, 8.577], 12);
  L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', {
    attribution:'© <a href="https://www.swisstopo.admin.ch/">swisstopo</a>',
    maxZoom:18
  }).addTo(map);

  const stops = [
    { name:'Lodano',           lat:46.2500, lng:8.6833, color:'#8b7355', r:9,  info:'Day 1 Start · Wed 16 Sept, 12:00 · Option 1 begins here' },
    { name:'Capanna Canaà',    lat:46.249554, lng:8.635203, color:'#8b7355', r:8,  info:'Night 1 · Wed 16 Sept' },
    { name:'Capanna Alzasca',  lat:46.2712, lng:8.5892, color:'#8b7355', r:8,  info:'Night 2 · Thu 17 Sept' },
    { name:'Capanna Ribia',    lat:46.251324, lng:8.541596, color:'#c0572a', r:10, info:'Night 3 · Fri 18 Sept 🎂 Birthday!' },
    { name:'Cimalmotto',       lat:46.2840, lng:8.4890, color:'#c0976a', r:11, info:'Night 4 · Sat 19 Sept — Option 2 joins here for dinner' },
    { name:'Bosco Gurin',      lat:46.3164, lng:8.4927, color:'#1a1a18', r:14, info:'Sun 20 Sept 🥂 — Grand Finale, all guests, lunch at Ristorante Walser' },
  ];

  L.polyline(stops.map(s => [s.lat, s.lng]), { color:'#8b7355', weight:2.5, opacity:0.7 }).addTo(map);

  stops.forEach(s => {
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:${s.r}px;height:${s.r}px;border-radius:50%;background:${s.color};border:2px solid white;box-shadow:0 1px 5px rgba(0,0,0,0.3)"></div>`,
      iconSize:[s.r,s.r], iconAnchor:[s.r/2,s.r/2]
    });
    L.marker([s.lat,s.lng],{icon}).addTo(map)
      .bindPopup(`<strong style="font-size:0.88rem">${s.name}</strong><br><span style="font-size:0.76rem;color:#5c5c56">${s.info}</span>`);
  });
}

// ── INIT ──────────────────────────────────────────────────────────────
setLang('it');
window.addEventListener('load', () => { initMap(); });
</script>
</body>
</html>
