<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos · Mathieu · 50 · Via Alta Valle Maggia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf9f7; --dark: #1a1a18; --mid: #5c5c56; --light: #9e9e94;
      --accent: #8b7355; --accent-light: #d4c4a8; --border: #e8e6e0; --gap: 96px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; font-weight: 300; background: var(--cream); color: var(--dark); line-height: 1.7; font-size: 16px; }

    /* NAV */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 18px 48px; background: rgba(250,249,247,0.93); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 1rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dark); text-decoration: none; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--dark); }
    .nav-links a.active { color: var(--dark); border-bottom: 1px solid var(--dark); padding-bottom: 1px; }
    .lang-switcher { display: flex; gap: 6px; align-items: center; }
    .lang-btn { background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--light); padding: 2px 4px; transition: color 0.2s; }
    .lang-btn.active { color: var(--dark); border-bottom: 1px solid var(--dark); }
    .lang-sep { color: var(--border); }

    /* PAGE HEADER */
    .page-header { background: var(--dark); padding: 140px 24px 80px; text-align: center; }
    .page-header-eyebrow { font-size: 0.7rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent-light); margin-bottom: 20px; }
    .page-header-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.8rem, 8vw, 5.5rem); font-weight: 300; color: #fff; line-height: 1; letter-spacing: -0.01em; }
    .page-header-title em { font-style: italic; color: var(--accent-light); }
    .page-header-sub { margin-top: 20px; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.45); }

    /* SHARED */
    .section-wrap { max-width: 920px; margin: 0 auto; padding: var(--gap) 24px; }
    .section-label { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; display: block; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 300; line-height: 1.15; margin-bottom: 28px; }
    .body-text { color: var(--mid); max-width: 640px; line-height: 1.85; }

    /* GALLERY */
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 40px; }
    .gal-item { position: relative; aspect-ratio: 4/3; background: var(--border); overflow: hidden; cursor: zoom-in; border: none; padding: 0; }
    .gal-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .gal-item:hover img { transform: scale(1.03); }
    .gal-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 0.68rem; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,0.55)); }
    .gal-empty { grid-column: 1 / -1; padding: 48px 24px; border: 1px dashed var(--accent-light); text-align: center; color: var(--mid); font-size: 0.9rem; }
    .gal-sub { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 300; margin-top: 64px; }
    .btn { display: inline-block; margin-top: 28px; padding: 13px 36px; background: var(--dark); color: var(--cream); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: var(--accent); }
    /* LIGHTBOX */
    #lb { position: fixed; inset: 0; z-index: 200; background: rgba(15,13,9,0.94); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
    #lb.open { display: flex; }
    #lb img { max-width: 100%; max-height: 82vh; object-fit: contain; }
    #lb-cap { color: rgba(255,255,255,0.75); font-size: 0.8rem; margin-top: 14px; text-align: center; }
    .lb-btn { position: absolute; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; padding: 12px 18px; opacity: 0.7; }
    .lb-btn:hover { opacity: 1; }
    #lb-close { top: 10px; right: 10px; } #lb-prev { left: 4px; top: 50%; transform: translateY(-50%); } #lb-next { right: 4px; top: 50%; transform: translateY(-50%); }

    /* FOOTER */
    footer { text-align: center; padding: 56px 24px; border-top: 1px solid var(--border); }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; margin-bottom: 10px; }
    .footer-info { font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light); }

    /* RESPONSIVE */
    @media (max-width: 800px) {
      nav { padding: 14px 20px; }
      .nav-links { display: none; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav id="main-nav">
  <a href="index.html" class="nav-logo">Mathieu · 50</a>
  <ul class="nav-links">
    <li><a href="index.html#recap"         data-t="nav_recap"></a></li>
    <li><a href="index.html#options"       data-t="nav_options"></a></li>
    <li><a href="index.html#programme"     data-t="nav_programme"></a></li>
    <li><a href="index.html#map-section"   data-t="nav_map"></a></li>
    <li><a href="index.html#accommodation" data-t="nav_accom"></a></li>
    <li><a href="photos.html" class="active" data-t="nav_photos"></a></li>
    <li><a href="messageboard.html"        data-t="nav_messages"></a></li>
  </ul>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" onclick="setLang('fr')">FR</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" onclick="setLang('it')">IT</button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <p class="page-header-eyebrow" data-t="hero_eyebrow"></p>
  <h1 class="page-header-title" id="page-title"></h1>
  <p class="page-header-sub" data-t="page_subtitle"></p>
</div>

<!-- GALLERY -->
<div class="section-wrap" id="gallery">
  <span class="section-label" data-t="gallery_label"></span>
  <h2 class="section-title" data-t="gallery_title"></h2>
  <p class="body-text" data-t="gallery_body"></p>
  <div class="gallery-grid" id="gallery-grid"></div>

  <h3 class="gal-sub" data-t="guest_title"></h3>
  <div class="gallery-grid" id="guest-grid"></div>
  <a class="btn" id="upload-btn" href="messageboard.html" data-t="upload_btn"></a>
</div>

<!-- LIGHTBOX -->
<div id="lb" onclick="if(event.target===this)closeLb()">
  <button class="lb-btn" id="lb-close" onclick="closeLb()" aria-label="Close">×</button>
  <button class="lb-btn" id="lb-prev" onclick="stepLb(-1)" aria-label="Previous">‹</button>
  <img id="lb-img" alt="" />
  <p id="lb-cap"></p>
  <button class="lb-btn" id="lb-next" onclick="stepLb(1)" aria-label="Next">›</button>
</div>

<!-- FOOTER -->
<footer>
  <p class="footer-logo">Mathieu · 50</p>
  <p class="footer-info">16 – 20 · IX · 2026 · Via Alta Valle Maggia · Ticino · Switzerland</p>
</footer>

<script>
// ── TRANSLATIONS ──────────────────────────────────────────────────────
const T = {
  en: {
    nav_options:'Options', nav_programme:'Programme', nav_map:'Map', nav_accom:'Stay',
    nav_recap:'Recap', nav_photos:'Photos', nav_messages:'Messages',
    hero_eyebrow:'16 – 20 September 2026 · Valle Maggia, Ticino',
    page_title:'Photos',
    page_subtitle:'Memories from the journey',
    gallery_label:'Memories', gallery_title:'Photos.',
    gallery_body:'Photos from four days on the Via Alta Valle Maggia, the dinner in Cimalmotto and the lunch in Bosco Gurin. Click a photo to enlarge it.',
    guest_title:'From our guests', upload_btn:'Share your photos',
    empty:'The first photos are on their way.', guest_empty:'No guest photos yet — be the first to share yours on the message board!',
  },
  fr: {
    nav_options:'Options', nav_programme:'Programme', nav_map:'Carte', nav_accom:'Séjour',
    nav_recap:'Récit', nav_photos:'Photos', nav_messages:'Messages',
    hero_eyebrow:'16 – 20 Septembre 2026 · Valle Maggia, Tessin',
    page_title:'Photos',
    page_subtitle:'Souvenirs du voyage',
    gallery_label:'Souvenirs', gallery_title:'Photos.',
    gallery_body:"Les photos de quatre jours sur la Via Alta Valle Maggia, du dîner à Cimalmotto et du déjeuner à Bosco Gurin. Cliquez sur une photo pour l'agrandir.",
    guest_title:'Les photos des invités', upload_btn:'Partager vos photos',
    empty:'Les premières photos arrivent bientôt.', guest_empty:"Pas encore de photos d'invités — soyez le premier à partager les vôtres sur le livre d'or !",
  },
  it: {
    nav_options:'Opzioni', nav_programme:'Programma', nav_map:'Mappa', nav_accom:'Soggiorno',
    nav_recap:'Racconto', nav_photos:'Foto', nav_messages:'Messaggi',
    hero_eyebrow:'16 – 20 Settembre 2026 · Valle Maggia, Ticino',
    page_title:'Foto',
    page_subtitle:'Ricordi del viaggio',
    gallery_label:'Ricordi', gallery_title:'Foto.',
    gallery_body:'Le foto di quattro giorni sulla Via Alta Valle Maggia, della cena a Cimalmotto e del pranzo a Bosco Gurin. Clicca su una foto per ingrandirla.',
    guest_title:'Le foto degli invitati', upload_btn:'Condividi le tue foto',
    empty:'Le prime foto arriveranno presto.', guest_empty:'Ancora nessuna foto degli invitati — sii il primo a condividere le tue sulla bacheca dei messaggi!',
  }
};

let lang = 'en';

function setLang(l) {
  lang = l;
  const t = T[l];
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    if (t[k] !== undefined) el.textContent = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.querySelectorAll('a[href^="messageboard.html"]').forEach(a => a.href = `messageboard.html?lang=${l}`);
  renderGalleries();
}

// ── PHOTOS ────────────────────────────────────────────────────────────
// To add photos: put the files in the /photos folder of the repo and list them here.
// { src: 'photos/filename.jpg', caption: 'optional caption' }
const PHOTOS = [
];

// Guest photos come from the message board (Google Apps Script)
const MESSAGE_BOARD_URL = 'https://script.google.com/macros/s/AKfycbyTPn8MPv_CRJ9rVQs5BQ9HCJHFQMr_73q1vVFibnxP1DS8Za2Okcm_r88Ix0o0ug1shA/exec';
let guestPhotos = [];
let lbList = [], lbIdx = 0;

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function driveImg(url) {
  const m = url && url.includes('drive.google.com') && url.match(/[?&]id=([^&]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600' : url;
}
function tiles(list, group) {
  return list.map((p, i) => `
    <button class="gal-item" onclick="openLb('${group}', ${i})">
      <img src="${esc(p.src)}" alt="${esc(p.caption)}" loading="lazy" onerror="this.parentElement.style.display='none'" />
      ${p.caption ? `<span class="gal-cap">${esc(p.caption)}</span>` : ''}
    </button>`).join('');
}
function renderGalleries() {
  const t = T[lang];
  document.getElementById('gallery-grid').innerHTML = PHOTOS.length ? tiles(PHOTOS, 'main') : `<div class="gal-empty">${t.empty}</div>`;
  document.getElementById('guest-grid').innerHTML = guestPhotos.length ? tiles(guestPhotos, 'guest') : `<div class="gal-empty">${t.guest_empty}</div>`;
}
async function loadGuestPhotos() {
  try {
    const res = await fetch(MESSAGE_BOARD_URL, { redirect:'follow' });
    const data = await res.json();
    if (!Array.isArray(data)) return;
    guestPhotos = data.filter(m => m.img).map(m => ({ src: driveImg(m.img), caption: m.name }));
    renderGalleries();
  } catch(_) {}
}

// ── LIGHTBOX ──────────────────────────────────────────────────────────
function openLb(group, i) {
  lbList = group === 'main' ? PHOTOS : guestPhotos; lbIdx = i; showLb();
  document.getElementById('lb').classList.add('open');
}
function showLb() {
  const p = lbList[lbIdx];
  document.getElementById('lb-img').src = p.src;
  document.getElementById('lb-cap').textContent = p.caption || '';
}
function stepLb(d) { lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLb(); }
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') stepLb(-1);
  if (e.key === 'ArrowRight') stepLb(1);
});

// ── INIT ──────────────────────────────────────────────────────────────
const initLang = new URLSearchParams(window.location.search).get('lang');
setLang(['en','fr','it'].includes(initLang) ? initLang : 'it');
loadGuestPhotos();
</script>
</body>
</html>
